name: Recover historical migration

on:
  push:
    branches:
      - reconcile-legacy-migration-versions-20260917

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact Supabase migration
        shell: bash
        run: |
          set -euo pipefail
          target="supabase/migrations/20260915022210_phase5_mailroom_correspondence.sql"
          cat \
            .migration-recovery/part1 \
            .migration-recovery/part2 \
            .migration-recovery/part3 \
            .migration-recovery/part4 \
            .migration-recovery/part5 \
            .migration-recovery/part6 > "$target"
          actual="$(git hash-object "$target")"
          expected="4ab5fe69894d3e77de87a7710924f461a2f57e58"
          test "$actual" = "$expected"
          rm -rf .migration-recovery
          rm -f .github/workflows/recover-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "restore exact phase5 mailroom migration from Supabase history"
          git push
