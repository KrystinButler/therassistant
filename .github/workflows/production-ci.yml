name: Production CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm --filter ./scripts exec tsx --test ../artifacts/therassistant-inventory/tests/**/*.test.ts

      - name: Production auth contract
        run: node scripts/check-production-auth.mjs

      - name: Patient chart TypeScript gate
        run: pnpm --filter @workspace/therassistant-inventory run typecheck:phase2

      - name: Production TypeScript gate
        run: pnpm --filter @workspace/therassistant-inventory run typecheck:phase3

      - name: Browser secret scan
        shell: bash
        run: |
          if grep -R -n -E 'SUPABASE_SERVICE_ROLE_KEY|sb_secret_' artifacts/therassistant-inventory/src; then
            echo "Forbidden Supabase server secret marker found in browser source."
            exit 1
          fi

      - name: Build
        run: pnpm --filter @workspace/therassistant-inventory run build

      - name: Smoke built SPA routes
        shell: bash
        run: |
          pnpm --filter @workspace/therassistant-inventory exec vite preview --config vite.config.ts --host 127.0.0.1 --port 4173 > /tmp/therassistant-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/therassistant-preview.log
            exit 1
          fi

          routes=(
            "/"
            "/clients"
            "/eligibility"
            "/schedule"
            "/patient-portal/login"
            "/patient-portal/activate"
            "/billing"
            "/providers"
            "/credentialing"
            "/payers-contracts"
            "/mailroom"
            "/mailroom/75000000-0000-4000-8000-000000000001"
            "/billing/charges"
            "/rejections"
            "/claims"
            "/denials"
            "/payments"
            "/work-center"
          )

          for route in "${routes[@]}"; do
            code="$(curl -sS -o /tmp/therassistant-route.html -w '%{http_code}' "http://127.0.0.1:4173${route}")"
            test "$code" = "200"
            grep -q '<div id="root"' /tmp/therassistant-route.html
          done

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E
        env:
          E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
        run: pnpm test:e2e
