name: Production CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: SMART auth TypeScript gate
        run: pnpm run typecheck:libs && pnpm --filter @workspace/api-server run typecheck:smart-auth

      - name: CAQH audit TypeScript gate
        run: pnpm --filter @workspace/api-server exec tsc -p tsconfig.caqh-audit.json --noEmit

      - name: Tests
        run: pnpm --filter ./scripts exec tsx --test ../artifacts/therassistant-inventory/tests/**/*.test.ts

      - name: Credentialing contract tests
        run: pnpm test:credentialing

      - name: Clinical API verifier safety
        run: node --test scripts/test-api-clinical-verifier-safety.mjs

      - name: Release acceptance evidence integrity
        run: pnpm verify:release-acceptance

      - name: Production auth contract
        run: node scripts/check-production-auth.mjs

      - name: Patient chart TypeScript gate
        run: pnpm --filter @workspace/therassistant-inventory run typecheck:phase2

      - name: Production TypeScript gate
        run: pnpm --filter @workspace/therassistant-inventory run typecheck:phase3

      - name: Browser secret scan
        shell: bash
        run: |
          if grep -R -n -E 'SUPABASE_SERVICE_ROLE_KEY|sb_secret_' artifacts/therassistant-inventory/src; then
            echo "Forbidden Supabase server secret marker found in browser source."
            exit 1
          fi

      - name: Build
        run: pnpm --filter @workspace/therassistant-inventory run build

      - name: Smoke built SPA routes
        shell: bash
        run: |
          pnpm --filter @workspace/therassistant-inventory exec vite preview --config vite.config.ts --host 127.0.0.1 --port 4173 > /tmp/therassistant-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/therassistant-preview.log
            exit 1
          fi

          routes=(
            "/"
            "/clients"
            "/eligibility"
            "/schedule"
            "/patient-portal/login"
            "/patient-portal/activate"
            "/billing"
            "/providers"
            "/credentialing"
            "/payers-contracts"
            "/operations/connected"
            "/administration/imports"
            "/administration/users"
            "/administration/audit"
            "/billing/charges"
            "/rejections"
            "/claims"
            "/denials"
            "/payments"
            "/work-center"
          )

          for route in "${routes[@]}"; do
            code="$(curl -sS -o /tmp/therassistant-route.html -w '%{http_code}' "http://127.0.0.1:4173${route}")"
            test "$code" = "200"
            grep -q '<div id="root"' /tmp/therassistant-route.html
          done

      - name: Start isolated Supabase E2E stack
        shell: bash
        run: |
          # Historical demo data was loaded outside the migration chain before this
          # data-only migration was created. Exclude it from clean local replay and
          # seed the isolated E2E dataset explicitly after schema migrations.
          mv supabase/migrations/20260915040049_phase5_mailroom_demo_seed.sql /tmp/phase5_mailroom_demo_seed.sql

          # The coding guidance staging table was also created historically outside
          # the reproducible chain. Make its later cleanup idempotent in isolated CI
          # so replay can reach the authorization acceptance tests.
          sed -i 's/drop table public\.coding_guidance_sheet_rows;/drop table if exists public.coding_guidance_sheet_rows;/' \
            supabase/migrations/20260929235306_remove_obsolete_ehr_authorization_mailroom_staging.sql

          # Production history contained legacy columns and historical rows that were
          # created outside the reproducible migration chain. Clean CI has none of
          # those rows, so neutralize only the legacy data backfills in the disposable
          # checkout while preserving all schema, constraint, RPC, policy, and index work.
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path_name, replacements, label):
              path = Path(path_name)
              sql = path.read_text()
              for old, replacement in replacements:
                  if old not in sql:
                      raise SystemExit(f"Expected {label} compatibility block was not found")
                  sql = sql.replace(old, replacement, 1)
              path.write_text(sql)

          def skip_historical_backfills(path_name, marker, label):
              path = Path(path_name)
              sql = path.read_text()
              if sql.count(marker) != 1:
                  raise SystemExit(f"Expected exactly one {label} backfill marker")
              prefix, _ = sql.split(marker, 1)
              path.write_text(
                  prefix
                  + marker
                  + "\n-- Isolated clean replay has no historical rows to backfill.\nselect 1;\n"
              )

          # These three migrations are exact recoveries from the live production
          # migration ledger. Their schema work must replay unchanged, but their
          # trailing data backfills reference legacy columns/state that existed in
          # production at that point in history and do not exist in a clean database.
          skip_historical_backfills(
              "supabase/migrations/20261010021609_strengthen_ehr_revenue_lineage.sql",
              "-- Backfill lineage where it is already unambiguous from existing encounter data.",
              "recovered EHR revenue lineage",
          )
          skip_historical_backfills(
              "supabase/migrations/20261010021637_strengthen_x12_snapshot_lineage.sql",
              "-- Backfill payment allocation lineage from claims.",
              "recovered X12 snapshot lineage",
          )
          skip_historical_backfills(
              "supabase/migrations/20261010021915_strengthen_edi_837_835_lineage.sql",
              "-- Backfill claim snapshot context from encounter/location where unambiguous",
              "recovered EDI lineage",
          )

          replace_exact(
              "supabase/migrations/20261010022215_harden_audit_and_edi_submission_lineage.sql",
              [
                  (
                      '''update public.claim_submissions
          set encounter_id=coalesce(encounter_id,"Encounter"), client_id=coalesce(client_id,client)
          where (encounter_id is null and "Encounter" is not null) or (client_id is null and client is not null);''',
                      '''-- Isolated clean replay has no historical claim_submissions rows to backfill.
          select 1;''',
                  ),
                  (
                      '''update public.claim_submissions cs
          set practice_entity_id=coalesce(cs.practice_entity_id,pc.practice_entity_id),
              provider_location_id=coalesce(cs.provider_location_id,pc.provider_location_id),
              insurance_policy_id=coalesce(cs.insurance_policy_id,pc.insurance_policy_id),
              encounter_id=coalesce(cs.encounter_id,pc.source_encounter_id),
              client_id=coalesce(cs.client_id,pc.client_id)
          from public.professional_claims pc where pc.id=cs.claim_id;''',
                      '''-- Isolated clean replay has no historical claim_submissions rows to enrich.
          select 1;''',
                  ),
              ],
              "claim_submissions legacy backfill",
          )

          operational_path = Path("supabase/migrations/20261010022301_normalize_operational_fk_names_and_secure_edi.sql")
          operational_sql = operational_path.read_text()
          operational_updates = [
              'update public.encounters set provider_location_id=coalesce(provider_location_id,location), tenant_user_id=coalesce(tenant_user_id,"User_id");',
              'update public.clinical_note_signatures set encounter_id=coalesce(encounter_id,"Encounter_Id"), tenant_user_id=coalesce(tenant_user_id,"User_id");',
              'update public.client_diagnoses set encounter_id=coalesce(encounter_id,"Encounter_Id"), treatment_plan_id=coalesce(treatment_plan_id,plan);',
              'update public.eligibility_benefits set insurance_policy_id=coalesce(insurance_policy_id,"Insurance");',
              'update public.denials set encounter_id=coalesce(encounter_id,"Encounter_Id");',
              'update public.encounter_diagnoses ed set client_id=coalesce(ed.client_id,ed."Patient",e.client_id) from public.encounters e where e.id=ed.encounter_id and ed.client_id is null;',
              'update public.credentialing_application_events set provider_id=coalesce(provider_id,"Provder_Id");',
              'update public.claim_status_history set appointment_id=coalesce(appointment_id,appointment), encounter_id=coalesce(encounter_id,"Encounter"), client_id=coalesce(client_id,"Client");',
              'update public.claim_diagnoses set appointment_id=coalesce(appointment_id,"Appointment");',
          ]
          for statement in operational_updates:
              if operational_sql.count(statement) != 1:
                  raise SystemExit(f"Expected exactly one operational legacy backfill statement: {statement}")
              operational_sql = operational_sql.replace(
                  statement,
                  '-- Isolated clean replay has no historical row to normalize.\nselect 1;',
                  1,
              )
          operational_path.write_text(operational_sql)
          PY

          pnpm dlx supabase@2.117.0 start
          pnpm dlx supabase@2.117.0 status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a

          PUBLISHABLE="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          SECRET="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"

          if [ -z "${API_URL:-}" ] || [ -z "${DB_URL:-}" ] || [ -z "$PUBLISHABLE" ] || [ -z "$SECRET" ]; then
            echo "Local Supabase did not expose the required E2E connection values."
            exit 1
          fi

          {
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SECRET_KEY=$SECRET"
            echo "DATABASE_URL=$DB_URL"
            echo "E2E_STAFF_EMAIL=staff.e2e@example.test"
            echo "E2E_PROVIDER_EMAIL=jamie.parker@example.test"
            echo "E2E_PATIENT_EMAIL=jordan.ellis@example.test"
          } >> "$GITHUB_ENV"

          STAFF_PASSWORD="$(openssl rand -hex 32)"
          PROVIDER_PASSWORD="$(openssl rand -hex 32)"
          PATIENT_PASSWORD="$(openssl rand -hex 32)"

          echo "::add-mask::$STAFF_PASSWORD"
          echo "::add-mask::$PROVIDER_PASSWORD"
          echo "::add-mask::$PATIENT_PASSWORD"

          {
            echo "E2E_STAFF_PASSWORD=$STAFF_PASSWORD"
            echo "E2E_PROVIDER_PASSWORD=$PROVIDER_PASSWORD"
            echo "E2E_PATIENT_PASSWORD=$PATIENT_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Seed isolated synthetic E2E data
        run: node scripts/provision-synthetic-e2e-identities.mjs

      - name: Verify claim diagnosis, policy, and revalidation handoffs
        shell: bash
        run: |
          # Fixtures run only inside the isolated CI database and roll back.
          for fixture in scripts/sql-tests/claim-handoff-*.sql scripts/sql-tests/clinical-handoff-*.sql; do
            docker exec -i supabase_db_therassistant-e2e psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$fixture"
          done

      - name: Verify isolated staff, provider, and patient boundaries
        run: node scripts/verify-synthetic-isolation.mjs

      - name: Start isolated API E2E server
        shell: bash
        run: |
          PORT=3001 pnpm --filter @workspace/scripts exec tsx start-api-e2e.mts > /tmp/therassistant-api-e2e.log 2>&1 &
          API_PID=$!
          echo "API_E2E_PID=$API_PID" >> "$GITHUB_ENV"

          ready=0
          for i in $(seq 1 30); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/clinical || true)"
            if [ "$code" = "401" ] || [ "$code" = "400" ] || [ "$code" = "403" ]; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/therassistant-api-e2e.log
            exit 1
          fi

      - name: Verify clinical API authorization
        run: node scripts/verify-api-clinical-authorization.mjs

      - name: Verify full system role matrix
        run: node scripts/verify-system-role-matrix.mjs

      - name: Verify isolated patient portal lifecycle
        run: node scripts/test-synthetic-patient-portal-lifecycle.mjs

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Staff and patient invitation callbacks
        run: node node_modules/@playwright/test/cli.js test --config tests/invitations/playwright.config.ts

      - name: FHIR browser runtime
        run: pnpm run test:fhir:browser

      - name: Browser E2E
        run: pnpm run test:e2e

      - name: Complete and verify synthetic insured revenue cycle
        run: node scripts/complete-synthetic-insured-revenue-cycle.mjs

      - name: Verify synthetic clinical-to-charge handoff
        run: node scripts/verify-synthetic-clinical-handoff.mjs

      - name: Verify isolated database restore rehearsal
        shell: bash
        run: |
          set -o pipefail
          bash scripts/verify-local-restore-drill.sh 2>&1 | tee /tmp/therassistant-restore-drill.log

      - name: Stop isolated API E2E server
        if: always()
        shell: bash
        run: |
          if [ -n "${API_E2E_PID:-}" ]; then
            kill "$API_E2E_PID" 2>/dev/null || true
          fi

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
            /tmp/therassistant-restore-drill.log
          if-no-files-found: ignore
