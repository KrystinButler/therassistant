name: Temporary E2E verification

# Rerun after payment selector correction.
on:
  push:
    branches:
      - chore/e2e-deterministic-builds
    paths:
      - .github/workflows/e2e-verification-temporary.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Run existing domain tests
        run: pnpm --filter ./scripts exec tsx --test ../artifacts/therassistant-inventory/tests/**/*.test.ts

      - name: TypeScript gate
        run: pnpm --filter @workspace/therassistant-inventory run typecheck:phase3

      - name: Browser secret scan
        shell: bash
        run: |
          if grep -R -n -E 'SUPABASE_SERVICE_ROLE_KEY|sb_secret_' artifacts/therassistant-inventory/src; then
            echo "Forbidden Supabase server secret marker found in browser source."
            exit 1
          fi

      - name: Production frontend build
        run: pnpm --filter @workspace/therassistant-inventory run build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E suite
        env:
          PLAYWRIGHT_BASE_URL: https://therassistant.vercel.app
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
