name: FHIR directory validation
on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/fhir/**'
      - 'tests/fhir/**'
      - '.github/workflows/fhir-validation.yml'
  push:
    branches: [main]
    paths:
      - 'artifacts/api-server/src/fhir/**'
      - 'tests/fhir/**'
      - '.github/workflows/fhir-validation.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/fhir/practitioner-role.test.ts
