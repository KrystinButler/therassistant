name: EHR Workflow Redesign CI

on:
  push:
    branches:
      - feat/ehr-ui-workflow-redesign

jobs:
  workflow-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Workflow regression tests
        shell: bash
        run: |
          set +e
          pnpm test:workflow 2>&1 | tee workflow-test.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Typecheck EHR application
        if: always()
        shell: bash
        run: |
          set +e
          pnpm --filter @workspace/therassistant-inventory run typecheck 2>&1 | tee ehr-typecheck.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload workflow verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-verification-output
          path: |
            workflow-test.log
            ehr-typecheck.log
