name: EHR Workflow Redesign CI

on:
  push:
    branches:
      - feat/ehr-ui-workflow-redesign

jobs:
  workflow-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Workflow regression tests
        run: pnpm test:workflow
