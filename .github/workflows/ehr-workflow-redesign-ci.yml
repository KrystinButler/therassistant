name: EHR Workflow Redesign CI

on:
  push:
    branches:
      - feat/ehr-ui-workflow-redesign

jobs:
  workflow-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Workflow regression tests
        shell: bash
        run: |
          set +e
          pnpm test:workflow 2>&1 | tee workflow-test.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Typecheck workspace
        if: always()
        shell: bash
        run: |
          set +e
          pnpm run typecheck 2>&1 | tee workspace-typecheck.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Install Chromium for workflow UI test
        run: pnpm exec playwright install --with-deps chromium

      - name: Portal telehealth handoff test
        shell: bash
        run: |
          set +e
          pnpm exec playwright test e2e/portal-telehealth-handoff.spec.ts --project=workflow-ui --workers=1 2>&1 | tee portal-telehealth-e2e.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload workflow verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-verification-output
          path: |
            workflow-test.log
            workspace-typecheck.log
            portal-telehealth-e2e.log
