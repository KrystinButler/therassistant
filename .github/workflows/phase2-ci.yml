name: Phase 2 CI

on:
  push:
    branches:
      - phase2-patient-chart
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm --filter ./scripts exec tsx --test ../artifacts/therassistant-inventory/tests/**/*.test.ts

      - name: Phase 2 typecheck
        run: pnpm --filter @workspace/therassistant-inventory run typecheck:phase2

      - name: Build
        run: pnpm --filter @workspace/therassistant-inventory run build

      - name: Smoke test SPA routes
        shell: bash
        run: |
          pnpm --filter @workspace/therassistant-inventory run serve -- --host 127.0.0.1 --port 4173 > /tmp/therassistant-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          routes=(
            "/"
            "/clients"
            "/clients/ff648f71-9c94-433c-9aab-f80b039a80fd"
            "/eligibility"
            "/authorizations"
            "/schedule"
            "/schedule/55000000-0000-4000-8000-000000000006"
            "/patient-portal/ff648f71-9c94-433c-9aab-f80b039a80fd"
            "/encounters/56000000-0000-4000-8000-000000000001"
          )
          for route in "${routes[@]}"; do
            echo "Checking $route"
            curl --fail --silent --show-error "http://127.0.0.1:4173$route" | grep -q '<div id="root"></div>'
          done
